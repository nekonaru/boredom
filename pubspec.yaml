name: boredom
description: Boredom, a tiny game for humans who do not know what to do with themselves.
publish_to: 'none'
version: 3.2.0+23

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Framework UI strings (time picker, date picker, text selection toolbar).
  # Without this the app's own text can be Indonesian while every dialog
  # Flutter draws stays English.
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Local persistence (XP, level, reroll count, history, streak)
  shared_preferences: ^2.3.2

  # Daily reminder notifications (Android only for now)
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

  # Share missions as text or as a generated PNG card
  share_plus: ^13.3.1
  cross_file: ^0.3.5+5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
