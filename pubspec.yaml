name: boredom
description: Boredom - game kecil untuk manusia yang tidak tahu harus ngapain.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Simpan progress (XP, level, reroll count, history, streak) secara lokal
  shared_preferences: ^2.3.2

  # Format tanggal (streak, riwayat misi)
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
