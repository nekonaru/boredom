<?xml version="1.0" encoding="UTF-8"?>
<!-- Boredom app icon source. Convert to PNG for launcher icons. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C6CFF"/>
      <stop offset="100%" stop-color="#5B4FD8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bgGrad)"/>

  <!-- Glow -->
  <circle cx="512" cy="380" r="340" fill="url(#glow)"/>

  <!-- Die body -->
  <rect x="190" y="290" width="644" height="644" rx="96" fill="#FFFFFF"/>

  <!-- Die shadow/edge -->
  <rect x="190" y="290" width="644" height="644" rx="96" fill="none" stroke="#E8E8EC" stroke-width="10"/>

  <!-- Dot helper: rounded die pip -->
  <defs>
    <circle id="pip" cx="0" cy="0" r="42" fill="#7C6CFF"/>
  </defs>

  <!-- Face "5" pattern (representing randomness / roll) -->
  <use href="#pip" x="312" y="412"/>
  <use href="#pip" x="712" y="412"/>
  <use href="#pip" x="512" y="512"/>
  <use href="#pip" x="312" y="612"/>
  <use href="#pip" x="712" y="612"/>

  <!-- Boredom "B" lettermark in center bottom -->
  <text x="512" y="790" font-family="sans-serif" font-weight="900" font-size="210" fill="#7C6CFF" text-anchor="middle" letter-spacing="-14">B</text>
</svg>
