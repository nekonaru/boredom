name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: 'stable'

      - name: Regenerate folder android dari template resmi Flutter
        run: |
          rm -rf android
          flutter create --platforms=android --org com.nikodwidharma --project-name boredom .

      - name: Cek format file Gradle yang beneran ke-generate (debug)
        run: |
          echo "Isi folder android/ (level atas):"
          ls -la android/
          echo ""
          echo "=== android/settings.gradle.kts ==="
          cat -n android/settings.gradle.kts 2>/dev/null || echo "(tidak ada)"
          echo ""
          echo "=== android/build.gradle.kts ==="
          cat -n android/build.gradle.kts 2>/dev/null || echo "(tidak ada)"
          echo ""
          echo "=== android/build.gradle (Groovy) ==="
          cat -n android/build.gradle 2>/dev/null || echo "(tidak ada)"
          echo ""
          echo "=== android/app/build.gradle.kts ==="
          cat -n android/app/build.gradle.kts 2>/dev/null || echo "(tidak ada)"
          echo ""
          echo "=== android/gradle.properties ==="
          cat -n android/gradle.properties 2>/dev/null || echo "(tidak ada)"
          echo ""
          echo "=== android/local.properties ==="
          cat -n android/local.properties 2>/dev/null || echo "(tidak ada)"

      - name: Pastikan Gradle resolve dependency lewat Google Maven, Maven Central, dan storage Flutter
        run: |
          python3 - << 'PYEOF'
          import pathlib

          p = pathlib.Path('android/settings.gradle.kts')
          content = p.read_text()

          block = """dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://storage.googleapis.com/download.flutter.io") }
              }
          }
          """

          key = 'dependencyResolutionManagement'
          idx = content.find(key)

          if idx == -1:
              content = content.rstrip('\n') + '\n\n' + block
          else:
              # Cari kurung kurawal pembuka setelah keyword, lalu hitung kurung
              # kurawal (bukan regex) biar aman walau blok-nya nested/berubah format.
              brace_start = content.find('{', idx)
              depth = 0
              i = brace_start
              while i < len(content):
                  if content[i] == '{':
                      depth += 1
                  elif content[i] == '}':
                      depth -= 1
                      if depth == 0:
                          break
                  i += 1
              block_end = i + 1
              content = content[:idx] + block.rstrip('\n') + content[block_end:]

          p.write_text(content)
          print(content)
          PYEOF

      - name: Ganti label aplikasi jadi "Boredom"
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:label="boredom"/android:label="Boredom"/' "$MANIFEST"
          if ! grep -q 'android:label="Boredom"' "$MANIFEST"; then
            echo "GAGAL: label 'Boredom' tidak ditemukan di manifest. Isi manifest saat ini:"
            cat "$MANIFEST"
            exit 1
          fi
          cat "$MANIFEST"

      - name: Install dependency
        run: flutter pub get

      - name: Pasang Gradle init script buat patch plugin lama (namespace/JVM-target)
        run: |
          # Init script Gradle SELALU Groovy dan jalan otomatis di semua
          # project yang di-build di runner ini, TERLEPAS dari project root-nya
          # pakai build.gradle (Groovy) atau build.gradle.kts (Kotlin DSL).
          # Ini menghindari masalah nebak-nebak file mana yang beneran dibaca
          # Gradle - init script nggak bersaing dengan file itu sama sekali.
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/boredom-patch.gradle << 'EOF'
          allprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      def androidExt = project.extensions.findByName('android')
                      if (androidExt != null) {
                          if (androidExt.hasProperty('namespace') && androidExt.namespace == null) {
                              def groupStr = project.group?.toString()
                              if (groupStr != null && groupStr.trim() != '' && groupStr != 'null') {
                                  androidExt.namespace groupStr
                              } else {
                                  androidExt.namespace 'com.nikodwidharma.boredom.' + project.name.replace('-', '_')
                              }
                          }
                          androidExt.compileOptions {
                              sourceCompatibility JavaVersion.VERSION_17
                              targetCompatibility JavaVersion.VERSION_17
                              coreLibraryDesugaringEnabled true
                          }
                          project.dependencies.add('coreLibraryDesugaring', 'com.android.tools:desugar_jdk_libs:2.1.4')
                          if (androidExt.hasProperty('defaultConfig')) {
                              androidExt.defaultConfig.multiDexEnabled = true
                          }
                          if (project.plugins.hasPlugin('org.jetbrains.kotlin.android') ||
                              project.plugins.hasPlugin('kotlin-android')) {
                              project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                                  kotlinOptions {
                                      jvmTarget = "17"
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF
          cat ~/.gradle/init.d/boredom-patch.gradle

      - name: Build APK
        run: flutter build apk --release

      - name: Cari file APK di manapun lokasinya
        run: |
          mkdir -p build/app/outputs/flutter-apk
          FOUND=$(find . -name "app-release.apk" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$FOUND" ]; then
            echo "APK tidak ditemukan, menampilkan semua file .apk yang ada:"
            find . -name "*.apk"
            exit 1
          fi
          echo "APK ditemukan di: $FOUND"
          cp "$FOUND" build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: boredom-apk
          path: build/app/outputs/flutter-apk/app-release.apk
